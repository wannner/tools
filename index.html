<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wannner的工具库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0f0f0f;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px}
.header{text-align:center;margin-bottom:50px}
.header h1{font-size:36px;font-weight:700;background:linear-gradient(135deg,#fc5c7d,#6a82fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.header p{font-size:14px;color:#666}
.grid{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;max-width:900px;width:100%}
.card{width:380px;background:#1a1a1a;border:1px solid #222;border-radius:16px;overflow:hidden;cursor:pointer;transition:all .3s ease;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:#fc5c7d;transform:translateY(-6px);box-shadow:0 12px 40px rgba(252,92,125,.15)}
.card-preview{height:200px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden}
.card:nth-child(1) .card-preview{background:linear-gradient(135deg,#1a1a2e,#16213e)}
.card:nth-child(2) .card-preview{background:linear-gradient(135deg,#1a1a2e,#0f3460)}
.card-body{padding:24px}
.card-body h2{font-size:20px;font-weight:700;margin-bottom:8px;color:#fff}
.card-body p{font-size:13px;color:#888;line-height:1.6;margin-bottom:16px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.tag-red{background:rgba(252,92,125,.15);color:#fc5c7d}
.tag-blue{background:rgba(106,130,251,.15);color:#6a82fb}
.tag-green{background:rgba(0,200,150,.15);color:#00c896}
.tag-purple{background:rgba(180,100,255,.15);color:#b464ff}
.footer{margin-top:50px;font-size:12px;color:#444}
</style>
</head>
<body>
<div class="header">
<h1>wannner的工具库</h1>
<p>B站封面制作工具集</p>
</div>
<div class="grid">
<a class="card" href="bilibili-cover-tool.html">
<div class="card-preview">🖼️</div>
<div class="card-body">
<h2>B站封面拼接工具</h2>
<p>上传多张图片，自由调整每张图的展示区域，拼接成B站封面。支持拖拽移动、滚轮缩放、边界吸附，导出高清PNG。</p>
<div class="tags">
<span class="tag tag-red">16:9 / 4:3</span>
<span class="tag tag-blue">9张 / 12张</span>
<span class="tag tag-green">PNG导出</span>
</div>
</div>
</a>
<a class="card" href="cover-mask-tool.html">
<div class="card-preview">✂️</div>
<div class="card-body">
<h2>B站封面人像抠图排版工具</h2>
<p>上传图片后涂抹标记人像区域，排版时标记区域浮在文字上方不被遮挡。支持艺术字体、居中辅助线吸附，导出高清PNG。</p>
<div class="tags">
<span class="tag tag-red">16:9 / 4:3</span>
<span class="tag tag-purple">艺术字体</span>
<span class="tag tag-green">PNG导出</span>
</div>
</div>
</a>
</div>
<div class="footer">点击卡片进入对应工具 · 所有操作均在浏览器本地完成</div>
</body>
</html>
